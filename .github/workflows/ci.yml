name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install websockets
      # Anti-dérive du SDK + tests Python (SDK, machine à fumée). devices/smallrig a ses propres tests
      # (npm install + build natif Bluetooth) : lancés à la main, le Bluetooth réel n'étant pas testable en CI.
      - run: npm test
